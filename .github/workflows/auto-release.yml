name: Auto release

# Auto-bumps versionCode/versionName every 3 weeks (if there are new commits
# since the last release), creates a PR, and triggers the release build when
# merged. The actual APK build + GitHub release is handled by android-release.yml.

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Target version name (e.g. b1.0.7). Leave empty to auto-increment."
        required: false
        default: ""
      base_branch:
        description: "Base branch for the version-bump PR"
        required: false
        default: bobnuvio
  schedule:
    - cron: "0 8 * * 1"  # Every Monday at 08:00 UTC

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.base_branch || 'bobnuvio' }}
          submodules: false

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189+github-actions[bot]@users.noreply.github.com"

      - name: Check for changes since last release
        id: changes
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 --match "b*" 2>/dev/null || echo "")
          if [ -z "$LATEST_TAG" ]; then
            echo "No previous release tag found - proceeding"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            COMMIT_COUNT=$(git rev-list --count "${LATEST_TAG}..HEAD" 2>/dev/null || echo 0)
            TAG_DATE=$(git log -1 --format=%ct "${LATEST_TAG}" 2>/dev/null || echo 0)
            NOW=$(date +%s)
            DAYS_SINCE=$(( (NOW - TAG_DATE) / 86400 ))
            WEEKS_SINCE=$(( DAYS_SINCE / 7 ))
            echo "Commits since ${LATEST_TAG}: ${COMMIT_COUNT}"
            echo "Weeks since last release: ${WEEKS_SINCE}"

            if [ "$COMMIT_COUNT" -eq 0 ]; then
              echo "No new code since last release - skipping"
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
            elif [ "$WEEKS_SINCE" -lt 3 ]; then
              echo "Only ${WEEKS_SINCE} weeks since last release - waiting for 3-week window"
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
            else
              echo "Changes detected and 3+ weeks elapsed - proceeding"
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Skip if no changes (schedule only)
        if: steps.changes.outputs.has_changes == 'false' && github.event_name == 'schedule'
        run: |
          echo "::notice::No release needed - skipping (either no changes or less than 3 weeks since last release)"

      - name: Compute new version
        if: steps.changes.outputs.has_changes == 'true' || github.event_name != 'schedule'
        id: version
        run: |
          VERSION_FILE="app/build.gradle.kts"
          LATEST_TAG=$(git describe --tags --abbrev=0 --match "b*" 2>/dev/null || echo "b0.0.0")
          TAG_VERSION="${LATEST_TAG#b}"
          MAJOR=$(echo "$TAG_VERSION" | cut -d. -f1)
          MINOR=$(echo "$TAG_VERSION" | cut -d. -f2)
          PATCH=$(echo "$TAG_VERSION" | cut -d. -f3)
          CURRENT_CODE=$(grep -oP '(?<=versionCode = )\d+' "$VERSION_FILE" | head -1)
          echo "Current: versionCode=$CURRENT_CODE, latest tag=$LATEST_TAG"

          if [ -n "${{ inputs.release_version }}" ]; then
            NEW_NAME="${{ inputs.release_version }}"
          else
            NEW_PATCH=$((PATCH + 1))
            NEW_NAME="${MAJOR}.${MINOR}.${NEW_PATCH}"
          fi

          NEW_CODE=$((CURRENT_CODE + 1))
          NEW_TAG="b${NEW_NAME}"

          echo "new_version_name=${NEW_NAME}" >> "$GITHUB_OUTPUT"
          echo "new_version_code=${NEW_CODE}" >> "$GITHUB_OUTPUT"
          echo "new_tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          echo "New: versionName=b${NEW_NAME}, versionCode=${NEW_CODE}"

      - name: Update version in gradle
        if: steps.changes.outputs.has_changes == 'true' || github.event_name != 'schedule'
        run: |
          VERSION_FILE="app/build.gradle.kts"
          sed -i -E "s|^([[:space:]]*versionCode[[:space:]]*=[[:space:]]*).*|\1${{ steps.version.outputs.new_version_code }}|" "$VERSION_FILE"
          sed -i -E "s|^([[:space:]]*versionName[[:space:]]*=[[:space:]]*\").*(\".*)\$|\1b${{ steps.version.outputs.new_version_name }}\2|" "$VERSION_FILE"
          echo "--- Updated version:"
          grep -E "versionCode|versionName" "$VERSION_FILE"

      - name: Create version-bump PR
        if: steps.changes.outputs.has_changes == 'true' || github.event_name != 'schedule'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_TAG="${{ steps.version.outputs.new_tag }}"
          NEW_NAME="${{ steps.version.outputs.new_version_name }}"
          NEW_CODE="${{ steps.version.outputs.new_version_code }}"
          BASE="${{ inputs.base_branch || 'bobnuvio' }}"

          git checkout -b "auto-release/${NEW_TAG}"
          git add app/build.gradle.kts
          COMMIT_FILE=$(mktemp)
          {
            printf 'bump version to b%s\n\n' "$NEW_NAME"
            echo "Auto-generated by the Auto release workflow."
            echo ""
            echo "- versionCode: ${NEW_CODE}"
            echo "- versionName: b${NEW_NAME}"
          } > "$COMMIT_FILE"
          git commit -F "$COMMIT_FILE"
          rm -f "$COMMIT_FILE"
          git push origin "auto-release/${NEW_TAG}"

          BODY_FILE=$(mktemp)
          {
            echo "## Auto-release version bump"
            echo ""
            echo "New version: **b${NEW_NAME}** (versionCode: ${NEW_CODE})"
            echo ""
            echo "- Base: \`${BASE}\`"
            echo "- Branch: \`auto-release/${NEW_TAG}\`"
          } > "$BODY_FILE"

          PR_NUM=$(
            gh pr create \
              --base "$BASE" \
              --head "auto-release/${NEW_TAG}" \
              --title "bump version to b${NEW_NAME}" \
              --body-file "$BODY_FILE" \
              --json number --template '{{ .number }}'
          ) || {
            # PR might already exist
            PR_NUM=$(gh pr list --head "auto-release/${NEW_TAG}" --state open --json number -q '.[0].number')
          }
          rm -f "$BODY_FILE"

          if [ -n "$PR_NUM" ]; then
            gh pr edit "$PR_NUM" --add-label "auto-release,version-bump" 2>/dev/null || true
          fi

          echo "pr_number=${PR_NUM}" >> "$GITHUB_OUTPUT"
          echo "Created version-bump PR: #${PR_NUM}"
