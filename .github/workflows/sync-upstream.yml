name: Sync upstream

# Merges upstream/dev into bobnuvio when upstream has new commits.
# Simple: check for changes, merge if needed, push result directly.

on:
  workflow_dispatch:
    inputs:
      upstream_branch:
        description: "Upstream branch to merge from"
        required: false
        default: dev
      base_branch:
        description: "Fork branch to merge into"
        required: false
        default: bobnuvio
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 06:00 UTC

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.base_branch || 'bobnuvio' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          if ! git remote | grep -q '^upstream'; then
            git remote add upstream https://github.com/NuvioMedia/NuvioTV.git
          fi
          git fetch upstream ${{ inputs.upstream_branch || 'dev' }}

      - name: Check if upstream has new commits
        id: check
        run: |
          UPSTREAM_REF="upstream/${{ inputs.upstream_branch || 'dev' }}"
          AHEAD=$(git rev-list --count "HEAD..${UPSTREAM_REF}" 2>/dev/null || echo 0)
          echo "Commits upstream ahead of bobnuvio: ${AHEAD}"
          if [ "$AHEAD" -eq 0 ]; then
            echo "No upstream changes — nothing to sync"
            echo "needs_sync=false" >> $GITHUB_OUTPUT
          else
            echo "Upstream has ${AHEAD} new commits"
            echo "needs_sync=true" >> $GITHUB_OUTPUT
          fi

      - name: Skip (no changes on schedule)
        if: ${{ steps.check.outputs.needs_sync == 'false' && github.event_name == 'schedule' }}
        run: |
          echo "::notice::No upstream changes since last sync — skipping"

      - name: Merge upstream into bobnuvio
        if: ${{ steps.check.outputs.needs_sync == 'true' }}
        run: |
          UPSTREAM_REF="upstream/${{ inputs.upstream_branch || 'dev' }}"
          echo "Merging ${UPSTREAM_REF} into HEAD..."
          MERGE_MSG=$(mktemp)
          printf 'chore: sync upstream/%s\n\n' "${{ inputs.upstream_branch || 'dev' }}" > "$MERGE_MSG"
          printf 'Merged %s into %s.\n\n' "$UPSTREAM_REF" "${{ inputs.base_branch || 'bobnuvio' }}" >> "$MERGE_MSG"
          printf 'Automated by sync-upstream workflow.\n' >> "$MERGE_MSG"
          printf 'Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\n' >> "$MERGE_MSG"
          git merge --no-ff "${UPSTREAM_REF}" -F "$MERGE_MSG"
          rm -f "$MERGE_MSG"
          echo "Merge complete"

      - name: Push merged bobnuvio
        if: ${{ steps.check.outputs.needs_sync == 'true' }}
        run: |
          git push origin "${{ inputs.base_branch || 'bobnuvio' }}"
          echo "::notice::Successfully merged upstream/${{ inputs.upstream_branch || 'dev' }} into ${{ inputs.base_branch || 'bobnuvio' }}"
